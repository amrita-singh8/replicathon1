<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Replicathon1</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <!-- navbar -->

    <nav>

        <img src="/assets/logo.png" alt="logo" width="80px" height="40px">

        <div class="link">
            <a href="#home"> Home</a>
            <a href="#product"> Products</a>
            <a href="#contact"> Contact</a>
        </div>

        <button class="placeOrder">
            Place Order
            <img src="assets/placeOrder.svg" alt="order logo" width="15px" height="14px" />
        </button>

    </nav>

    <div class="button11">
        <button class="button"> Products</button>
        <button class="button2">Custom</button>
    </div>

    <!-- body -->
    <main>
        <div class="text">
            <p>FIND YOUE GREATNESS</p>
            <article>
                Build for speed and confidence,every pair combines primium material and bold design.Engeenred for
                comfort,made for movement
            </article>
        </div>

        <div class="img">
            <h3>HYPE</h3>
            <img src="/assets/shoe.png" alt="shoe" width="250px" height="250px">
        </div>

        <div class="container">
            <h3>Choose Your Colour</h3>
            <div class="colors">
                <div class="circle blue"></div>
                <div class="circle orange"></div>
                <div class="circle light-orange"></div>
            </div>

            <div class="numbers">
                <div>40</div>
                <div>42</div>
                <div>44</div>
            </div>

        </div>
    </main>

    <footer>
        <div>
            <img src="/assets/instagram.svg" alt="insta" width="80px" height="40px">
            <img src="/assets/facebook.svg" alt="FB" width="40px" height="40px">
            <img src="/assets/pinterest.svg" alt="pinterest" width="40px" height="40px">
            <img src="/assets/youtube.svg" alt="YT" width="40px" height="40px">
        </div>

        <div>
            <h4>—— SNEAKERS FOR MORE ——</h4>
        </div>

        <div>
            <button>
                See All Products
                <img src="/assets/arrow.svg" alt="arrow" width="20px" height="15px">
            </button>
        </div>
    </footer>
</body>

</html>
